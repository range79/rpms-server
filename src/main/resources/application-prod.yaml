spring:
  application:
    name: range-package-manager-server

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  thymeleaf:
    check-template-location: false
    cache: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL:false}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver


rpms:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    name: ${APP_MAIL_NAME:RPMS Security}

password-encoder:
  hash-length: ${PASSWORD_ENCODER_HASH_LENGTH:32}
  salt-length: ${PASSWORD_ENCODER_SALT_LENGTH:16}
  memory: ${PASSWORD_ENCODER_MEMORY:65536}
  parallelism: ${PASSWORD_ENCODER_PARALLELISM:1}
  iterations: ${PASSWORD_ENCODER_ITERATIONS:3}
reset-token:
  email-limit: ${RESET_TOKEN_EMAIL_LIMIT:3}
  time: ${RESET_TOKEN_TIME:300}

password-reset:
  frontend-url: ${FRONTEND_URL}

jwt:
  secret: ${JWT_SECRET}
  expires-at: ${JWT_EXPIRE_TIME:15}

refresh-token:
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
springdoc:
  swagger-ui:
    enabled: false