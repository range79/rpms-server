spring:
  application:
    name: range-package-manager-server
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  thymeleaf:
    check-template-location: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: create-drop


# password encoder configurations
password-encoder:
  hash-length: ${PASSWORD_ENCODER_HASH_LENGTH:32}
  salt-length: ${PASSWORD_ENCODER_SALT_LENGTH:16}
  memory: ${PASSWORD_ENCODER_MEMORY:65536}
  parallelism: ${PASSWORD_ENCODER_PARALLELISM:1}
  iterations: ${PASSWORD_ENCODER_ITERATIONS:3}

# reset token configurations
reset-token:
  email-limit: ${RESET_TOKEN_EMAIL_LIMIT:3}
  time: ${RESET_TOKEN_TIME:300}

# app configurations
rpms:
  mail:
    from: ${MAIL_USERNAME:}
    name: ${APP_MAIL_NAME:RPMS Security}

# password reset configurations
password-reset:
  frontend-url: ${FRONTEND_URL}
# jwt configurations
jwt:
  secret: ${JWT_SECRET}
  expires-at: ${JWT_EXPIRE_TIME:15}
refresh-token:
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}