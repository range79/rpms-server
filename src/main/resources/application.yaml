spring:
  application:
    name: range-package-manager-server
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL:PASSWORD}

password-encoder:
  hash-length: ${PASSWORD_ENCODER_HASH_LENGTH:32}
  salt-length: ${PASSWORD_ENCODER_SALT_LENGTH:16}
  memory: ${PASSWORD_ENCODER_MEMORY:65536}
  parallelism: ${PASSWORD_ENCODER_PARALLELISM:1}

reset-token:
  email-limit: ${RESET_TOKEN_EMAIL_LIMIT:3}
  time: ${RESET_TOKEN_TIME:300}